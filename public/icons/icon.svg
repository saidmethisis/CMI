<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Asosiy Aktiv">
  <!--
    Значок издания. Собран из тех же элементов, что и шапка сайта: фирменный
    тёмно-синий фон и акцентная красная черта рядом с литерой.

    Буква нарисована контурами, а не текстом: шрифт на устройстве читателя и на
    сервере, который делает из этого PNG, может отличаться или отсутствовать —
    тогда вместо буквы вышел бы пустой квадрат.

    Поля намеренно широкие: Android обрезает значок под форму системы (круг,
    капля, квадрат со скруглением), и всё, что ближе к краю, съедается.
  -->
  <rect width="512" height="512" rx="112" fill="#11294D"/>

  <!-- Литера A: две наклонные стойки и перекладина -->
  <path d="M256 128 L344 384 L296 384 L277 326 L235 326 L216 384 L168 384 Z"
        fill="#ffffff"/>
  <!-- Просвет внутри литеры, чтобы она читалась и на мелком размере -->
  <path d="M256 206 L243 288 L269 288 Z" fill="#11294D"/>

  <!-- Акцентная черта — та же, что стоит слева от названия в шапке -->
  <rect x="168" y="404" width="176" height="20" rx="10" fill="#C81E3A"/>
</svg>
